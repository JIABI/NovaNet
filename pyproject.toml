[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novanet-handover"
version = "0.2.0"
description = "Orbit-aware structured decision learning for LEO handover"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "torch>=2.1,<3",
  "sgp4>=2.23,<3",
  "PyYAML>=6,<7",
  "pandas>=2,<3",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.setuptools]
packages = ["novanet"]

[tool.setuptools.data-files]
"share/novanet/configs" = ["configs/paper.yaml"]
"share/novanet" = ["starlink.tle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
