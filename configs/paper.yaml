schema_version: 5

experiment:
  seed: 2025
  tle_path: starlink.tle
  tle_selection: shell_stratified_orbit_balanced_nested
  start_utc: "2023-05-01T09:30:00+00:00"
  duration_s: 2400
  decision_interval_s: 30
  geometry_subsample_s: 5
  minimum_elevation_deg: 10.0
  candidate_cap: 8
  num_satellites: 60
  ue_latitude_deg: [-60.0, 60.0]
  ue_longitude_deg: [-180.0, 180.0]
  ue_altitude_m: 0.0

channel:
  carrier_hz: 12000000000.0
  bandwidth_hz: 20000000.0
  bandwidth_options_hz: [20000000.0, 100000000.0]
  eirp_density_dbw_mhz: 34.0
  ue_antenna_elements: 1
  ue_antenna_gain_dbi: 0.0
  exogenous_interference_power_w: 0.0
  system_noise_temperature_k: 290.0
  implementation_efficiency: 0.75
  outage_threshold_db: 0.0
  minimum_rate_bps: 100000.0
  gaseous_zenith_loss_db: 0.12
  rain_rate_mm_h: 8.0
  rain_specific_attenuation_db_km: 0.018
  rician_k_db: 15.0
  shadowing_std_db: 1.5
  measurement_iir_alpha: 0.5
  measurement_interval_s: 30
  # The nominal training/evaluation condition adds no report corruption.
  # Measurement-noise sweeps override this explicitly in their scenarios.
  nominal_measurement_std_db: 0.0
  doppler_tracking_efficiency: 0.995
  doppler_estimation_std_hz: 25.0
  coherent_integration_s: 1.00e-4

handover:
  ttt_s: 0.100
  execution_s: 0.150
  statistics_window_s: 60
  hysteresis_db: 1.5
  freeze_steps: 1
  failure_outage_fraction: 0.5
  event_step_s: 0.010

planner:
  horizon_steps: 6
  temperature: 1.0
  policy_temperature: 1.0
  teacher_temperature: 1.0
  lcb_kappa: 1.5
  rate_reference_mbps: 50.0
  ttl_reference_s: 600.0
  alpha: 1.0
  beta: 0.35
  c0: 1.0
  c1: 0.50
  c2: 1.50
  load_weight: 0.50

model:
  # Retained only for historical top-level imports. It is not concatenated
  # with the six-dimensional satellite--UE node vector.
  ue_feature_dim: 4
  node_feature_dim: 6
  transition_feature_dim: 5
  hidden_dim: 128
  gnn_layers: 2
  graph_neighbors: 4
  adjacency_temperature: 1.0
  elevation_reference_deg: 90.0
  elevation_rate_reference_deg_s: 1.0
  range_reference_m: 2000000.0
  range_rate_reference_m_s: 10000.0
  sinr_reference_db: 30.0

training:
  num_samples: 3600
  epochs: 100
  batch_size: 64
  num_workers: 0
  learning_rate: 1.00e-3
  weight_decay: 1.00e-4
  gradient_clip: 1.0
  use_amp: false
  nll_weight: 0.20
  hof_weight: 0.50
  path_weight: 0.50
  checkpoint_path: checkpoints/novanet_paper.pt

traffic:
  packet_size_bytes: 1500
  arrival_process: poisson
  arrival_rate_packets_s: 500.0
  queue_discipline: fifo
  queue_capacity_packets: 4096
  fixed_network_delay_ms: 33.5
  protocol_processing_ms: 1.0

multi_ue:
  satellite_capacity_mbps: 1200.0
  max_users_per_satellite: 32
  minimum_admission_rate_mbps: 10.0
  scheduler: proportional_fair
  association_update: synchronous_two_phase
  region_center_lat_deg: 51.5
  region_center_lon_deg: 0.0
  region_radius_km: 500.0
  # The manuscript denotes this validation-selected constant as c_blk but
  # does not report its numeric value. Keep it explicit rather than inventing
  # a value; the multi-UE runner requires an override for manuscript runs.
  blocking_cost: null
